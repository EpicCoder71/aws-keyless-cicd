name: Test and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        default: dev
      operation:
        type: choice
        options: [apply, destroy]
        default: apply
      confirmation:
        description: 'For destroy, enter destroy-dev or destroy-prod'
        type: string
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.17.1'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=bootstrap init -backend=false -input=false
      - run: terraform -chdir=bootstrap validate
      - run: checkov -d terraform --framework terraform --quiet
  deploy:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    concurrency:
      group: deploy-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_environment: ${{ inputs.environment || 'dev' }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      OPERATION: ${{ inputs.operation || 'apply' }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TF_VAR_account_id"
          test -n "$TF_VAR_aws_region"
          test -n "$STATE_BUCKET"
          if [ "$OPERATION" = destroy ]; then
            test "$CONFIRMATION" = "destroy-$TF_VAR_environment"
          fi
          mkdir -p .build
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Initialize state
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=$TF_VAR_environment/terraform.tfstate" \
            -backend-config="region=$TF_VAR_aws_region" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Plan and apply
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$OPERATION" = destroy ]; then args+=(-destroy); fi
          terraform -chdir=terraform plan -input=false -lock-timeout=5m "${args[@]}" -out=deployment.tfplan
          terraform -chdir=terraform apply -input=false deployment.tfplan
      - name: Smoke test
        if: env.OPERATION == 'apply'
        run: |
          aws lambda invoke --function-name "keyless-cicd-$TF_VAR_environment" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"rawPath":"/health"}' /tmp/response.json
          python -c 'import json; r=json.load(open("/tmp/response.json")); assert r["statusCode"] == 200; assert json.loads(r["body"])["status"] == "ok"'
